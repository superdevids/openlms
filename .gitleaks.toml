# gitleaks.toml — scan secret di repo (opsional, jalankan manual/CI).
# Jalankan: gitleaks detect --source . --config .gitleaks.toml
#
# Cakupan:
# - .env        → TIDAK dikecualikan; bila ter-commit, secret di dalamnya tetap terdeteksi.
#   (lihat .gitignore — .env memang sudah di-ignore; proteksi berlapis).
# - *.pem/.key  → rule private-key di bawah + rule default gitleaks (privatekey).
# - JWT secret  → rule opensis-jwt-secret (JWT_*_SECRET non-placeholder).
# - .env.example → dikecualikan (nilai placeholder dev, bukan secret nyata).

title = "opensis gitleaks config"

[extend]
useDefault = true

[allowlist]
# CATATAN (go-live): `docs/` dan `*.md` SENGAJA dikecualikan dari scan —
# dokumentasi sering memuat contoh secret/URL internal yang memicu false
# positive. Konsekuensinya secret yang HANYA muncul di .md/docs TIDAK
# terdeteksi gitleaks → WAJIB dicek manual saat review/commit dokumen
# (mis. grep pola secret + eyeball diff). Jangan hapus pengecualian ini
# tanpa menyediakan pengganti pemeriksaan manual.
description = "Path yang dikecualikan dari scan — .env sengaja TIDAK dimasukkan"
paths = [
  "docs/",
  "*.md",
  ".env.example",
  "apps/api/.env.example",
  "package-lock.json",
  "dist/",
  ".next/",
  "coverage/"
]

# Placeholder dev (.env.example) — nilai contoh, bukan secret.
[[rules]]
id = "opensis-env-placeholder"
description = "Nilai placeholder di .env.example adalah contoh, bukan secret"
regex = '''(change-me-32-bytes-random)'''
secret-group = 1

# JWT secret yang di-set via env (nilai nyata >= 16 char; placeholder dikecualikan).
[[rules]]
id = "opensis-jwt-secret"
description = "JWT secret nyata (JWT_*_SECRET) — wajib acak 32+ byte di production"
regex = '''(?i)(JWT_(ACCESS|REFRESH|INVITATION)_SECRET|JWT_SECRET)\s*[:=]\s*"?([A-Za-z0-9_\-\.\/+]{16,})"?'''
secret-group = 3
[rules.allowlist]
regexes = ["change-me-32-bytes-random"]

# Private key ter-commit (*.pem, *.key) — insiden serius.
[[rules]]
id = "opensis-private-key"
description = "Private key ter-commit (PEM/OpenSSH/PGP)"
regex = '''-----BEGIN (RSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'''
secret-group = 1

# Secret lain di file env/konfigurasi (bukan placeholder, bukan template ${...}).
[[rules]]
id = "opensis-env-secret"
description = "Nilai secret non-placeholder di env/konfigurasi"
regex = '''(?i)[A-Z0-9_]*(SECRET|TOKEN|PASSWORD|API_KEY)\s*[:=]\s*"?([^"'\s]{16,})"?'''
secret-group = 2
[rules.allowlist]
regexes = ["change-me-32-bytes-random", '\$\{']
