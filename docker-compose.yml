# opensis — compose untuk layanan pendukung (PostgreSQL + Redis opsional).
# Jalankan: docker compose up -d
# Redis dipakai antrean BullMQ (REDIS_URL) — layanan app tetap jalan tanpa Redis
# (QueueModule fallback in-process). Aktifkan Redis:
#   docker compose --profile full up -d
# Nilai env diambil dari .env (interpolasi ${VAR:-default}).

services:
  postgres:
    image: postgres:16-alpine
    container_name: opensis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opensis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opensis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opensis-redis
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Layanan aplikasi (opsional, profile "full") ---
