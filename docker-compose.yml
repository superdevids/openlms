# ============================================================
# opensis — DEV mode Docker Compose (infra-only)
#
# Mode DEV: HANYA infra di container (postgres + redis + nginx);
# aplikasi (apps/api + apps/web) dijalankan di HOST via `npm run dev`.
# Nginx mem-proxy ke app di host lewat host.docker.internal
# (deploy/nginx.dev.conf; extra_hosts host-gateway).
#
# Jalankan:
#   cp .env.example .env        # lalu isi secret (JWT, DATABASE_URL, dll)
#   docker compose up -d        # hanya postgres + redis + nginx
#   npm run dev                 # Turbo dev: api :3001 + web :3000 di HOST
#   # migrasi + seed dari host (postgres terekspos di localhost:5432)
#   npm run db:migrate:deploy
#   npm run db:seed
# Akses aplikasi: http://localhost (Nginx :80 -> host.docker.internal)
#
# Mode PROD (full-stack, 5 service di container):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   (overlay prod menambah api + web dan mengalihkan nginx ke nginx.docker.conf)
# ============================================================

name: opensis

# Logging default semua service: json-file, rotasi 10MB x 3 file
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: opensis-postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opensis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opensis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    networks:
      - opensis-net

  redis:
    image: redis:7-alpine
    container_name: opensis-redis
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # AOF aktif — antrean BullMQ tidak boleh hilang saat restart.
    # Auth wajib: requirepass = ${REDIS_PASSWORD} (default dev redis-dev-password).
    # Nilai harus SAMA dengan REDIS_URL (redis://:<password>@...) yang dipakai
    # aplikasi (lihat .env.example — REDIS_PASSWORD + REDIS_URL).
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis-dev-password}"
      ]
    environment:
      # Diekspos ke container agar healthcheck ($${...} = eval shell di dalam
      # container) memakai password yang sama dengan --requirepass.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD:-redis-dev-password}" --no-auth-warning ping | grep -q PONG'
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.10"
          memory: 64m
    networks:
      - opensis-net

  nginx:
    image: nginx:1.27-alpine
    container_name: opensis-nginx
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "80:80"
    extra_hosts:
      # Akses aplikasi yang berjalan di HOST (bukan di container)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/opensis.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/_nginx_health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.10"
          memory: 64m
    networks:
      - opensis-net

volumes:
  postgres-data:
  redis-data:

networks:
  opensis-net:
    driver: bridge
