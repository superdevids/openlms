# opensis — reverse proxy DEV (mode split: infra di Docker, aplikasi di host)
# - apps/web (Next.js di host)    → http://host.docker.internal:3000
# - apps/api (NestJS di host)     → http://host.docker.internal:3001 (REST /api/v1 + Socket.IO /ws)
# Salinan deploy/nginx.docker.conf dengan upstream diarahkan ke HOST lewat
# host.docker.internal (docker-compose.yml dev: extra_hosts host-gateway).
# Semua hardening dipertahankan identik dengan versi production.

# --- Rate limit zone per-IP (http context; file ini di-include dari http{}) ---
# api_limit    : 30 r/s per IP (burst 100) — lapis awal; app juga enforce 100/menit/IP.
# login_limit  : 1 r/s per IP untuk /api/v1/auth/login (brute-force; app: 10/menit + locked_until).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

# --- Batas koneksi per IP ---
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Status untuk rate-limit/connection-limit (bukan 503) ---
limit_req_status 429;
limit_conn_status 429;

# --- TLS hardening (aktif saat server 443 HTTPS dipakai) ---
ssl_protocols TLSv1.2 TLSv1.3;   # SSLv2/SSLv3/TLSv1/TLSv1.1 nonaktif
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    server_name _;

    server_tokens off;
    limit_conn conn_limit 10;

    client_max_body_size 10m;
    # --- Timeout hardening (serangan slowloris / koneksi gantung) ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;

    # --- Buffer overflow protection ---
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- Security headers (defense-in-depth; header asli juga diset oleh NestJS/Next) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip — teks, JSON API, JS, CSS, SVG
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # Healthcheck compose (depends_on/healthcheck nginx) — tanpa log
    location = /_nginx_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Aset Next.js — hash pada nama file → cache 1 tahun immutable
    location /_next/static/ {
        proxy_pass http://host.docker.internal:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # (add_header child menggantikan header server — deklarasi ulang security headers)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Login — rate limit agresif + batas koneksi ketat (brute-force)
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_conn conn_limit 5;
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # API NestJS (REST /api/v1) — tanpa buffering tambahan agar SSE/long-poll stabil
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Socket.IO — path engine.io default (/socket.io), namespace /ws — rate limit + upgrade
    location /socket.io/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Socket.IO namespace /ws — Upgrade/Connection wajib untuk websocket
    location /ws {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Next.js di HOST (SSR + fallback)
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
